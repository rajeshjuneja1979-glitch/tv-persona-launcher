name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nocturne.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-debug-apk
          path: nocturne.apk
      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest nocturne.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nocturne (latest build)" --notes "Debug APK built from commit $GITHUB_SHA"
